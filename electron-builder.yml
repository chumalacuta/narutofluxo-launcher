appId: 'helioslauncher'
productName: 'Fluxo Launcher'
artifactName: 'Fluxo-Launcher-setup-${version}.${ext}'

copyright: 'Copyright © 2018-2024 Silva'

asar: true
compression: 'maximum'

files:
  - '!{dist,bundle,tests,tools,artifacts,fluxo-local.json,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,.eslintrc.json}'

extraResources:
  - 'libraries'
  - from: bundle
    to: bundle

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'Daniel Scalzi'
  vendor: 'Daniel Scalzi'
  synopsis: 'Modded Minecraft Launcher'
  description: 'Custom launcher which allows users to join modded servers. All mods, configurations, and updates are handled automatically.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'
# Updates are enabled only with an explicit feed in fluxo-settings.json.
publish:
  provider: generic
  url: https://github.com/chumalacuta/narutofluxo-launcher/releases/latest/download
